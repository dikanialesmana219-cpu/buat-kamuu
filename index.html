<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dudu Punya Pesan 🤍</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-one">

    <div class="floating-hearts">
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
    </div>

    <main class="first-screen">

        <p class="small-title">DUDU'S LITTLE SURPRISE</p>

        <h1>
            Ada sesuatu yang<br>
            mau Dudu kasih 🤍
        </h1>

        <p class="subtitle">
            Tapi Dudu masih ngumpet dulu...
        </p>


        <!-- TEMPAT DUDU NGUMPET -->

        <div class="hide-area">

            <div class="dudu-hidden" id="duduHidden">
                <img src="dudu.png" alt="Dudu">
            </div>

            <button class="peek-button" id="peekButton">
                <span>?</span>
                <small>tekan di sini</small>
            </button>

        </div>


        <!-- DUDU + SURAT -->

        <section class="letter-scene" id="letterScene">

            <div class="dudu-letter">

                <img src="dudu.png" alt="Dudu membawa surat">

                <div class="letter">

                    <div class="letter-heart">
                        ♡
                    </div>

                    <p class="typed-text" id="typedText"></p>

                </div>

            </div>


            <a href="halaman2.html" class="next-button">
                Lanjut ke kejutan berikutnya →
            </a>

        </section>


        <p class="bottom-note">
            Dudu cuma mau bikin suasana sedikit lebih baik ♡
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
